<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BuyFarm | Delivery</title><link rel="stylesheet" href="css/buyfarm.css"></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="BuyFarm"><span>BuyFarm</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Products</a><a class="active" href="buyonline.html">Order</a><a href="contactus.html">Contact</a></nav><div class="nav-actions"><button class="nav-button" id="cartButton" type="button">Cart <span class="count" id="cartCount">0</span></button><a class="nav-button primary" href="login page">Sign in</a></div></div></header>
<main class="container"><section class="page-heading"><span class="eyebrow">Delivery details</span><h1 class="page-title">Where should we deliver?</h1></section>
<form class="form-card" id="deliveryForm">
  <label>Full name<input name="name" required autocomplete="name" placeholder="Your name"></label>
  <label>Mobile number<input name="phone" type="tel" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number"></label>
  <label>Delivery address<textarea name="address" required rows="4" placeholder="House number, area, city"></textarea></label>
  <label>Pincode<input name="pincode" inputmode="numeric" pattern="[0-9]{6}" required placeholder="6-digit pincode"></label>
  <button class="button primary" type="submit">Continue to payment</button>
</form></main>
<aside class="drawer-backdrop" id="cartBackdrop" hidden><div class="drawer"><div class="drawer-header"><h2>Your cart</h2><button class="close-button" type="button" data-close-cart>×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-footer"><div class="cart-total"><span>Total</span><strong id="cartTotal">₹0</strong></div><button class="button primary full" id="checkoutButton" type="button">Continue to checkout</button></div></div></aside>
<div id="buyfarm-toast" class="toast" role="status"></div><script src="app.js"></script></body></html>

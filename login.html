<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BuyFarm | Sign In</title><link rel="stylesheet" href="css/buyfarm.css?v=latest"></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="BuyFarm"><span>BuyFarm</span></a><nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="buyonline.html">Order</a><a href="contactus.html">Contact</a></nav><div class="nav-actions"><button class="nav-button" id="cartButton" type="button">Cart <span class="count" id="cartCount">0</span></button><a class="nav-button primary" href="login.html">Sign in</a></div></div></header>
<main class="container login-wrap"><a class="login-back" href="#" id="loginBack">← Back</a><section class="page-heading"><span class="eyebrow">Welcome back</span><h1 class="page-title">Sign in to BuyFarm</h1></section><form class="form-card" id="loginForm"><label>Email<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Minimum 6 characters"></label><button class="button primary" type="submit">Sign in</button></form><div class="signin-success" id="signinSuccess" hidden><h2>Signed in successfully</h2><p>Continuing to your checkout...</p></div></main>
<aside class="drawer-backdrop" id="cartBackdrop" hidden><div class="drawer"><div class="drawer-header"><h2>Your cart</h2><button class="close-button" type="button" data-close-cart>×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-footer"><div class="cart-total"><span>Total</span><strong id="cartTotal">₹0</strong></div><button class="button primary full" id="checkoutButton" type="button">Continue to checkout</button></div></div></aside>
<div id="buyfarm-toast" class="toast" role="status"></div><script src="app.js?v=latest"></script></body></html>

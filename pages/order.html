<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuyFarm | Order</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <div class="brand">
        <img src="../assets/logo.svg" alt="BuyFarm logo" class="brand-logo" />
        <span>BuyFarm</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="order.html" class="active">Order</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="section form-section">
      <div class="section-header">
        <p class="eyebrow">Place order</p>
        <h1>Order your fresh goods</h1>
      </div>

      <form class="buy-form">
        <label>
          Full name
          <input type="text" name="name" placeholder="Enter your full name" />
        </label>

        <label>
          Mobile number
          <input type="tel" name="mobile" placeholder="Enter your mobile number" />
        </label>

        <label>
          Email
          <input type="email" name="email" placeholder="Enter your email" />
        </label>

        <label>
          Address
          <textarea name="address" rows="4" placeholder="House number, area, city, pincode"></textarea>
        </label>

        <label>
          Product
          <input type="text" name="product" placeholder="Name of the product" />
        </label>

        <label>
          Additional instructions
          <textarea name="notes" rows="3" placeholder="Any special instructions"></textarea>
        </label>

        <button type="submit" class="btn btn-primary">Submit order</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 BuyFarm</p>
      <a href="contact.html">Contact us</a>
    </div>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyFarm | Products</title>
  <link rel="stylesheet" href="css/buyfarm.css?v=latest">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="BuyFarm"><span>BuyFarm</span></a>
      <nav class="main-nav"><a href="index.html">Home</a><a class="active" href="products.html">Products</a><a href="buyonline.html">Order</a><a href="contactus.html">Contact</a></nav>
      <div class="nav-actions"><button class="nav-button" id="cartButton" type="button">Cart <span class="count" id="cartCount">0</span></button><a class="nav-button primary" href="login.html?v=latest">Sign in</a></div>
    </div>
  </header>
  <main class="container">
    <section class="page-heading"><span class="eyebrow">Marketplace</span><h1 class="page-title">Fresh farm products</h1><label><span class="sr-only">Search products</span><input class="search" id="searchInput" type="search" placeholder="Search products"></label></section>
    <div class="filters" aria-label="Product categories"><button class="filter active" type="button" data-category="All">All</button><button class="filter" type="button" data-category="Vegetables">Vegetables</button><button class="filter" type="button" data-category="Fruits">Fruits</button><button class="filter" type="button" data-category="Grains">Grains</button></div>
    <section class="section" style="padding-top:0"><div class="product-grid" id="shopProducts"></div><p class="empty-state" id="noProducts" hidden>No products match your search. Try another name or category.</p></section>
    <section class="category-links" aria-label="Browse product categories"><h2>Shop by category</h2><div><a href="productsvegetables.html">🥬 Vegetables <span>→</span></a><a href="productsfruits.html">🍎 Fruits <span>→</span></a><a href="productsgrains.html">🌾 Grains <span>→</span></a></div></section>
  </main>
<footer class="site-footer"><div class="container"><span>© 2026 BuyFarm · Fresh from local farms</span><nav aria-label="Footer"><a href="products.html">Shop</a><a href="orders.html">My orders</a><a href="wishlist.html">Wishlist</a><a href="account.html">My account</a><a href="contactus.html">Contact</a></nav></div></footer>
  <aside class="drawer-backdrop" id="cartBackdrop" hidden><div class="drawer"><div class="drawer-header"><h2>Your cart</h2><button class="close-button" type="button" data-close-cart>×</button></div><div class="cart-items" id="cartItems"></div><div class="cart-footer"><div class="cart-total"><span>Total</span><strong id="cartTotal">₹0</strong></div><button class="button primary full" id="checkoutButton" type="button">Continue to checkout</button></div></div></aside>
  <div id="buyfarm-toast" class="toast" role="status"></div>
  <script src="app.js?v=latest"></script>
</body>
</html>
